[project]
name = "infrabuddy"
version = "0.1.0"
description = "InfraBuddy — AI-powered AWS infrastructure analysis and troubleshooting agent"
readme = "README.md"
authors = [
    { name = "Test User", email = "test@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.108",
    "openai>=3.26.0",
    "python-dotenv>=1.2.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "moto>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
infrabuddy = "aws_ai_devops_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
