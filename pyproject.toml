[project]
name = "infrabuddy"
version = "0.1.0"
description = "InfraBuddy — AI-powered AWS infrastructure analysis and troubleshooting agent"
readme = "README.md"
authors = [
    { name = "Test User", email = "test@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.108",
    "openai>=3.26.0",
    "python-dotenv>=1.2.4",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "moto>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]
chatops = [
    "slack-bolt>=1.18.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "botbuilder-core>=4.16.0",
    "botbuilder-integration-aiohttp>=4.16.0",
    "aiohttp>=3.9.0",
    "mangum>=0.17.0",
]

[project.scripts]
infrabuddy = "main:main"
infrabuddy-server = "server:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "aws*", "chatops*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
